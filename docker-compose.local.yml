# Agency OS — LOCAL-ONLY hosting profile.
# Everything runs on one machine with zero cloud dependencies:
#   - MinIO replaces Cloudflare R2 (the S3 client already speaks path-style)
#   - magic links land in the dev mailbox file (or point SMTP_URL at any
#     LAN mail relay); password login works fully offline
#   - AI features fail loudly without ANTHROPIC_API_KEY (jobs surface in
#     /admin/health); everything non-AI is fully functional
#   - ports bind to 127.0.0.1 — change to 0.0.0.0 for LAN access
#
# Run:  cp .env.local-hosting.example .env.local-hosting
#       docker compose -f docker-compose.local.yml --env-file .env.local-hosting up -d
# See docs/20-local-hosting.md for the full walkthrough.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.local-hosting
    environment:
      DATABASE_URL: postgresql://agencyos:${POSTGRES_PASSWORD}@postgres:5432/agencyos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY: ${MINIO_ROOT_USER}
      R2_SECRET: ${MINIO_ROOT_PASSWORD}
      R2_BUCKET: agencyos
      DEV_MAILBOX: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    networks: [internal]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    env_file: .env.local-hosting
    environment:
      DATABASE_URL: postgresql://agencyos:${POSTGRES_PASSWORD}@postgres:5432/agencyos
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      R2_ENDPOINT: http://minio:9000
      R2_ACCESS_KEY: ${MINIO_ROOT_USER}
      R2_SECRET: ${MINIO_ROOT_PASSWORD}
      R2_BUCKET: agencyos
      EMBED_MODE: ${EMBED_MODE:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    networks: [internal]

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: agencyos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.local-hosting}
      POSTGRES_DB: agencyos
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agencyos"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env.local-hosting}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks: [internal]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.local-hosting}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.local-hosting}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # admin console (optional)
    networks: [internal]

  # One-shot: create the bucket with a CORS rule for browser PUTs.
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 1; done;
      mc mb --ignore-existing local/agencyos;
      exit 0"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks: [internal]

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  internal:
